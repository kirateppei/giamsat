<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Giám sát NLMT · Hiệp Minh Thịnh</title>
<link rel="icon" href="hmt_logo_nho.png">
<meta name="theme-color" content="#0b1b34">
<script>try{const t=localStorage.getItem("hmt-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --navy:#0b1b34;--navy2:#13284a;--navy3:#1c3763;--gold:#f5b301;--gold2:#ffcf4a;--gold-soft:#fff6d6;
  --bg:#f3f5fa;--card:#ffffff;--text:#0f1d33;--muted:#64748b;--line:#e3e8f0;
  --ok:#12a150;--ok-soft:#e5f7ec;--warn:#d98a00;--warn-soft:#fff3d6;--bad:#e0383e;--bad-soft:#fde7e7;
  --off:#7c8aa5;--off-soft:#eef1f6;--nd:#94a3b8;
  --r:16px;--sh:0 1px 2px rgba(11,27,52,.05),0 8px 24px rgba(11,27,52,.06);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111f;--card:#0f1d33;--text:#e8eef8;--muted:#8fa0bb;--line:#1d2f4d;
  --gold-soft:#2e2508;--ok-soft:#0d2a1b;--warn-soft:#2c2108;--bad-soft:#2d1013;--off-soft:#17243a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111f;--card:#0f1d33;--text:#e8eef8;--muted:#8fa0bb;--line:#1d2f4d;
  --gold-soft:#2e2508;--ok-soft:#0d2a1b;--warn-soft:#2c2108;--bad-soft:#2d1013;--off-soft:#17243a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* ---------- sidebar */
.side{background:linear-gradient(180deg,var(--navy) 0%,#0a1830 60%,#081428 100%);color:#d7e0ef;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand .sun{width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold) 60%,#d99a00);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(245,179,1,.35);font-size:20px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#8ea3c6;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#b9c6dc;font-weight:500;transition:.18s}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(245,179,1,.18),rgba(245,179,1,.04));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a.on svg{color:var(--gold);opacity:1}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:#7f93b5;padding:10px 8px;border-top:1px solid rgba(255,255,255,.07)}
.side .foot .live{display:inline-flex;align-items:center;gap:6px;color:#bfe9cf}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(18,161,80,.2)}
/* ---------- topbar */
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex-wrap:wrap}
.crumb a:hover{color:var(--text)}
.crumb .sep{opacity:.5}
.crumb b{color:var(--text)}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;color:var(--muted);min-width:260px}
.search kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.wrap{padding:26px 28px 90px;max-width:1500px}
/* ---------- hero */
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(245,179,1,.35),transparent 60%),linear-gradient(120deg,var(--navy) 0%,var(--navy3) 100%);
  color:#fff;border-radius:22px;padding:26px 28px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:.2px}
.hero p{margin:0;color:#b8c7e0}
.hero .big{margin-left:auto;text-align:right}
.hero .big .v{font-size:40px;font-weight:800;color:var(--gold2);letter-spacing:-.5px;line-height:1}
.hero .big small{color:#b8c7e0}
.hero .ring{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px dashed rgba(245,179,1,.25)}
/* ---------- kpi */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:block;transition:.18s;position:relative}
.kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);color:#b77f00;margin-bottom:10px}
.kpi .ic svg{width:19px;height:19px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:23px;font-weight:750;margin-top:2px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .go{position:absolute;right:14px;top:16px;color:var(--muted);opacity:0;transition:.18s}
.kpi:hover .go{opacity:1}
.kpi.bad .ic{background:var(--bad-soft);color:var(--bad)}.kpi.ok .ic{background:var(--ok-soft);color:var(--ok)}
/* ---------- cards / tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools select,.tools input{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:.12s;cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--gold) 7%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th .u{text-transform:none;letter-spacing:0}
th{white-space:normal;line-height:1.3}
.nm b{display:block;font-weight:600}.nm small{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}.t-off{background:var(--off-soft);color:var(--off)}.t-nd{background:var(--off-soft);color:var(--nd)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.spark{width:120px;height:30px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
/* ---------- station */
.shead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.shead h1{margin:0;font-size:22px}
.shead .meta{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow:auto}
.tabs a{padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.invs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.inv{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);transition:.15s;display:block}
.inv:hover{border-color:var(--gold);transform:translateY(-2px)}
.inv .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inv .h b{font-size:13.5px}
.inv .sn{color:var(--muted);font-size:12px;margin:2px 0 10px}
.inv .kw{font-size:20px;font-weight:750}
.inv .kw small{font-size:12px;color:var(--muted);font-weight:500}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.ch{border-radius:9px;padding:6px 4px;text-align:center;font-size:11px;border:1px solid var(--line)}
.ch b{display:block;font-size:12.5px}
.ch.on{background:var(--ok-soft);border-color:transparent}.ch.lo{background:var(--warn-soft)}.ch.off{background:var(--off-soft);color:var(--muted)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.ev .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ev .t{font-weight:600}.ev .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.ev .act{margin-left:auto;display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:600;font-size:12.5px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.loss{color:var(--bad);font-weight:700}
.chart{width:100%;height:220px}
.empty{color:var(--muted);text-align:center;padding:30px}
.demo{background:var(--gold-soft);border:1px dashed var(--gold);color:#7a5600;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
:root[data-theme="dark"] .demo{color:var(--gold2)}
/* ---------- search modal */
.modal{position:fixed;inset:0;background:rgba(8,17,31,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding-top:12vh}
.modal.on{display:flex}
.palette{width:min(620px,92vw);background:var(--card);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:inherit;font-size:16px;background:transparent;color:var(--text);outline:0}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .res a{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px}
.palette .res a:hover,.palette .res a.sel{background:var(--gold-soft)}
.palette .res small{color:var(--muted);margin-left:auto}
/* ---------- biểu đồ tương tác, điểm đo */
.ichart{position:relative;width:100%;height:240px;touch-action:pan-y}
.ichart svg{width:100%;height:100%;display:block}
.ctip{position:absolute;top:8px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;pointer-events:none;min-width:170px;z-index:2}
.ctip b{font-weight:700}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--card);padding:7px 14px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.dnav{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--card)}
.dnav span{padding:0 8px;font-weight:600;font-size:12.5px}
.dnav button{border:0;background:var(--bg);border-radius:8px;width:28px;height:28px}
.dnav button:disabled{opacity:.35;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px}
.mt{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.mt span{color:var(--muted)}.mt b{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}.seg{margin-left:0}.ichart{height:200px}}/* ---------- nền sinh động: logo, nông trại pin, hoa văn tấm pin */
body{background:
  radial-gradient(900px 420px at 100% -10%, color-mix(in srgb,var(--gold) 16%,transparent), transparent 70%),
  radial-gradient(700px 380px at -10% 110%, color-mix(in srgb,#3b6fd8 12%,transparent), transparent 70%),
  repeating-linear-gradient(115deg, transparent 0 46px, color-mix(in srgb,var(--line) 55%,transparent) 46px 47px),
  repeating-linear-gradient(25deg, transparent 0 46px, color-mix(in srgb,var(--line) 35%,transparent) 46px 47px),
  var(--bg);background-attachment:fixed}
.brand .logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none;overflow:hidden}
.brand .logo img{width:40px;height:40px;object-fit:contain}
/* ảnh thật của HMT: mái pin (menu trái), cánh đồng pin flycam (băng chào), mái pin trời mây (đầu trang trạm) */
.side{background:
  linear-gradient(180deg,rgba(11,27,52,.97) 0%,rgba(11,27,52,.93) 45%,rgba(8,20,40,.72) 100%),
  url("anh/menu.jpg") center bottom/cover no-repeat,var(--navy)}
.hero{min-height:170px;background:
  linear-gradient(90deg,rgba(11,27,52,.94) 0%,rgba(11,27,52,.78) 38%,rgba(11,27,52,.25) 75%,rgba(11,27,52,.1) 100%),
  url("anh/bang_chao.jpg") center 40%/cover no-repeat,var(--navy3)}
.hero > div:not(.big){position:relative;z-index:2}.hero .big{position:relative;z-index:2;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .wm{position:absolute;left:-30px;bottom:-40px;width:200px;opacity:.06;z-index:1;filter:grayscale(1) brightness(3)}
.hero .big small{color:#e6ecf7}
.shead.photo{background:linear-gradient(90deg,rgba(11,27,52,.92),rgba(11,27,52,.55) 60%,rgba(11,27,52,.2)),url("anh/tram.jpg") center 60%/cover no-repeat,var(--navy3);
  color:#fff;border-radius:20px;padding:22px 24px;box-shadow:var(--sh)}
.shead.photo .meta{color:#d3dced}.shead.photo a{color:var(--gold2)!important}
.frame{width:100%;border:0;display:block;height:calc(100vh - 140px);border-radius:16px;background:var(--bg)}
.incbox{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
@media (min-width:761px){table.stt{min-width:1180px}table.stt td.nm{min-width:190px}}
.ichips{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}
.ichip{font-size:11.5px;font-weight:600;border-radius:8px;padding:2px 8px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.ichip.more{cursor:pointer}.ichip.more:hover{color:var(--text)}
.ichips .ex,.ichips .less{display:none}.ichips.all .ex,.ichips.all .less{display:inline-block}.ichips.all .more:not(.less){display:none}
.ichips.all .ichip{white-space:normal;max-width:none}
.ichip.bad{background:var(--bad-soft);color:var(--bad)}.ichip.warn{background:var(--warn-soft);color:var(--warn)}.ichip.more{background:var(--off-soft);color:var(--muted)}
.issl{display:grid;gap:8px}.issl div{display:flex;gap:10px;align-items:flex-start}.issl .ichip{flex:none}.issl small{color:var(--muted);font-size:12.5px;line-height:1.45}
.incbox{flex:1 1 320px;justify-content:flex-end;flex-wrap:nowrap}.incbox .pill{flex:none}
.inctk{flex:0 1 auto!important;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block!important;transition:opacity .25s;border-color:color-mix(in srgb,var(--bad) 35%,var(--line))!important}
.incmini{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.incmini a{display:flex;gap:10px;align-items:center;border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));background:var(--bad-soft);border-radius:12px;padding:8px 12px;font-size:13px;min-width:0}
.incmini a.w{border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:var(--warn-soft)}
.incmini a b{white-space:nowrap}.incmini a span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.incmini a em{font-style:normal;color:var(--muted);white-space:nowrap;font-size:12px}
.incmini .more{font-size:12.5px;color:var(--muted);padding:2px 4px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(224,56,62,.6);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,56,62,.55)}70%{box-shadow:0 0 0 8px rgba(224,56,62,0)}100%{box-shadow:0 0 0 0 rgba(224,56,62,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.incrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.incrow{grid-template-columns:1fr}}
.loading{color:var(--muted);text-align:center;padding:60px 20px}
.xh-t{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:16px 0 6px}
table.xh td{vertical-align:top}table.xh td:first-child{width:60px}table.xh td:nth-child(2){width:26%}table.xh td:nth-child(3){width:130px}
.xh-miss{display:flex;gap:8px;flex-wrap:wrap}.xh-miss a{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--muted)}
/* bảng theo dõi xử lý (kiểu FusionSolar) */
.bx{display:flex;flex-direction:column;gap:14px}
.bx-head{background:#1c3248;color:#fff;border-radius:18px;padding:20px 24px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;box-shadow:var(--sh)}
.bx-head h2{margin:0 0 4px;font-size:22px;letter-spacing:.3px}.bx-head p{margin:0;color:#dfe7f2}.bx-head small{color:#b9c6da}
.bx-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.bx-head .btn{color:var(--text)}
.bx-sum{display:flex;gap:10px;flex-wrap:wrap;font-size:19px;align-items:baseline}.bx-sum span{color:var(--muted)}
.bx-cmp{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:-6px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=0)=>n==null?"—":Number(n).toLocaleString("vi-VN",{maximumFractionDigits:d,minimumFractionDigits:d});
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const PK="hmt_pin:"+location.pathname;      // mỗi trang nhớ mã PIN riêng
let PIN=store.get(PK)||"",D=null,keyCache={};
async function decrypt(enc,pin){
  const id=pin+"|"+enc.salt+"|"+enc.iter;
  if(!keyCache[id]){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
    keyCache={[id]:await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"])};
  }
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},keyCache[id],b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(){
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("Chưa có số liệu ("+r.status+")");
  return decrypt(await r.json(),PIN);
}
async function unlock(){
  $("#err").textContent="Đang mở…";
  try{D=await load();if($("#remember").checked)store.set(PK,PIN);
    $("#lock").classList.add("hidden");$("#app").classList.remove("hidden");$("#bnav").classList.remove("hidden");$("#err").textContent="";route()}
  catch(e){$("#err").textContent=e.name==="OperationError"?"Sai mã PIN":(e.message||"Không mở được");store.del(PK)}
}
$("#go").onclick=()=>{PIN=$("#pin").value.trim();if(PIN)unlock()};
$("#pin").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#logout").onclick=e=>{e.preventDefault();store.del(PK);location.reload()};

const ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',

 chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
 inv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h5"/><circle cx="15" cy="16" r="1.5"/></svg>',
};
const NAV=[["#","Tổng quan","home"],["#suco","Sự cố","alert"],["#thang","Sản lượng tháng","chart"]];
const STATE={ok:["Bình thường","t-ok"],warn:["Cảnh báo","t-warn"],off:["Ngoại tuyến","t-bad"],nodata:["Chưa có số liệu","t-nd"]};
const stOf=s=>s.o>0&&s.st==="ok"?"warn":s.st;
const tag=s=>{const [t,c]=STATE[s]||["—","t-nd"];return `<span class="tag ${c}"><i></i>${t}</span>`};
const dur=m=>{m=Math.round(m||0);const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return (d?d+" ngày ":"")+(h?h+" giờ ":"")+(d?"":mm+" phút")};
const stUrl=k=>"#tram="+encodeURIComponent(k);
function chrome(active,crumbs){
  $("#nav").innerHTML=NAV.map(([h,t,i])=>`<a href="${h}" class="${h===active?'on':''}">${ICON[i]}${t}${h==="#suco"?`<span class="cnt">${D.events.filter(e=>!e.w).length}</span>`:''}</a>`).join("");
  $("#bnav").innerHTML=NAV.map(([h,t,i])=>`<a href="${h}" class="${h===active?'on':''}">${ICON[i]}${t}</a>`).join("");
  $("#crumb").innerHTML=crumbs.map((c,i)=>i<crumbs.length-1?`<a href="${c[1]}">${esc(c[0])}</a><span class="sep">›</span>`:`<b>${esc(c[0])}</b>`).join("");
  $("#backBtn").style.visibility=crumbs.length>1?"visible":"hidden";

  $("#liveSide").innerHTML=age>40?`<span class="dot" style="background:var(--bad)"></span> Chưa cập nhật ${age} phút`:`<span class="dot"></span> ${esc(D.may)} đang chạy`;

function notes(){
  const age=Math.round((Date.now()-new Date(D.ts).getTime())/60000);let n="";
  if(age>40)n+=`<div class="demo" style="background:var(--bad-soft);border-color:var(--bad);color:var(--bad)">⚠ Trang chưa được cập nhật ${age} phút - máy chạy phần mềm có thể đang tắt / mất mạng.</div>`;
  if(D.night)n+=`<div class="demo">🌙 Ban đêm: phần mềm chỉ lấy số liệu ${esc(D.hours)}, số liệu mới nhất lúc ${esc(D.last)}.</div>`;
  return n;
}
function spark(arr,w=120,h=30){
  const v=(arr||[]).map(x=>x==null?null:+x);const mx=Math.max(1,...v.filter(x=>x!=null));
  let d="",on=false;v.forEach((y,i)=>{if(y==null){on=false;return}const X=i/(v.length-1)*w,Y=h-2-(y/mx)*(h-4);d+=(on?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1);on=true});
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function issueChips(L,max=3){
  L=L||[];if(!L.length)return '<span class="muted">—</span>';
  const one=x=>`<span class="ichip ${x.lv}" title="${esc(x.t+(x.d?': '+x.d:''))}">${esc(x.t)}</span>`;
  if(L.length<=max)return `<div class="ichips">${L.map(one).join('')}</div>`;
  return `<div class="ichips" onclick="event.stopPropagation()">${L.slice(0,max).map(one).join('')}<span class="ichip more" role="button" onclick="this.parentNode.classList.add('all')">+${L.length-max} lỗi</span>${L.slice(max).map(x=>one(x).replace('class="ichip','class="ichip ex')).join('')}<span class="ichip more less" role="button" onclick="this.parentNode.classList.remove('all')">Thu gọn</span></div>`;
}

  incStrip.list=L;
  if(!D.events.length)return `<span class="incbox"><span class="tag t-ok"><i></i>Không có sự cố đang mở</span></span>`;

}
function incTk(x){return `<b>${esc(x.s)}</b> · ${esc(x.k)} · <span class="muted">${dur(x.min)}${x.l?' · '+fmt(x.l)+' kW':''}</span>`}
setInterval(()=>{const el=document.getElementById("incTk"),L=incStrip.list||[];if(!el||L.length<2)return;tk=(tk+1)%L.length;

function lineChart(sp,kwp){
  const v=(sp||[]).map(x=>x==null?null:+x),ok=v.filter(x=>x!=null);
  if(!ok.length)return '<div class="empty">Chưa có số liệu hôm nay.</div>';

  v.forEach((y,i)=>{if(y==null){on=false;return}p+=(on?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)+" ";on=true});
  let g="";for(let k=0;k<=4;k++){const y=Y(mx*k/4);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(mx*k/4)}</text>`}
  const t=[5,7,9,11,13,15,17,19].map(h=>`<text x="${X(Math.min((h-5)*3,41))}" y="${H-7}" font-size="11" text-anchor="middle" fill="var(--muted)">${h}h</text>`).join("");
  return `<svg class="chart2" viewBox="0 0 ${W} ${H}">${g}<path d="${p}" fill="none" stroke="#f5b301" stroke-width="2.4"/>${t}</svg>`;
}
function barChart(days){

  return `<svg class="chart2" viewBox="0 0 ${W} ${H}">${g}`+days.map((y,i)=>{const h=(H-B-12)*y/mx;return `<rect x="${(L+i*bw+bw*.18).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${y?'#13284a':'var(--line)'}" class="bcol"><title>Ngày ${i+1}: ${fmt(y)} kWh</title></rect>`+

}

    <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="ic">${ICON.chart}</div><div class="l">Sản lượng tháng ${esc(D.month_label||"")}</div><div class="v">${tot>=10000?fmt(tot/1000,1)+" MWh":fmt(tot)+" kWh"}</div><div class="s">${sel.length} trạm</div></div>
      <div class="kpi"><div class="ic">${ICON.sun}</div><div class="l">Trung bình / ngày</div><div class="v">${dn?(tot/dn>=10000?fmt(tot/dn/1000,1)+" MWh":fmt(tot/dn)+" kWh"):"—"}</div><div class="s">${dn} ngày có số liệu</div></div>
      <div class="kpi"><div class="ic">${ICON.bolt}</div><div class="l">Cao nhất</div><div class="v">${best>=10000?fmt(best/1000,1)+" MWh":fmt(best)+" kWh"}</div><div class="s">ngày ${days.indexOf(best)+1}</div></div></div>
    <div class="card"><h2>Sản lượng từng ngày (kWh)${MC?" · "+esc(MC):""}</h2>${barChart(days)}</div>
    <div class="card"><h2>Theo công ty <span class="more">bấm để xem riêng</span></h2><div class="tw"><table><thead><tr><th>Công ty</th><th class="num">Trạm</th><th class="num">MWh tháng</th><th class="num"><span class="u">kWh/kWp</span></th></tr></thead>
      <tbody>${rows.map(r=>`<tr onclick="MC=this.dataset.c;pageMonth();scrollTo(0,0)" data-c="${esc(r.c)}"><td><b>${esc(r.c)}</b></td><td class="num">${r.n}</td><td class="num">${fmt(r.t/1000,1)}</td><td class="num">${r.kwp?fmt(r.t/r.kwp,1):"—"}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function route(){
  if(!D)return;
  const h=location.hash,m=h.match(/^#tram=(.+)$/),s=m&&D.stations.find(x=>x.key===decodeURIComponent(m[1]));
  if(s)pageStation(s);else if(h==="#suco")pageInc();else if(h==="#thang")pageMonth();else pageHome();
}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});
function toggleTheme(){const r=document.documentElement;const dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dk?"light":"dark";store.set("hmt-theme",r.dataset.theme)}
setInterval(async()=>{if(!D||document.hidden||document.querySelector(".ichips.all"))return;try{D=await load();const y=scrollY;route();scrollTo(0,y)}catch(e){}},120000);
if(PIN){$("#remember").checked=true;unlock()}
</script>
</body>
</html>
